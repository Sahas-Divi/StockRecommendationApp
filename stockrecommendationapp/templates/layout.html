{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}Home{%endblock%} — StockLens</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <nav class="navbar">
        <div class="navbar-logo">
            <span class="logo-mark">◈</span>
            <span class="logo-text">StockLens</span>
        </div>

        <div class="navbar-links">
            <a href="" class="nav-btn signup-btn">
                <span>Sign Up</span>
            </a>
            <a href="" class="nav-btn signin-btn">
                <span>Sign In</span>
            </a>
            <a href="" class="nav-btn signout-btn">
                <span>Sign Out</span>
            </a>
        </div>
    </nav>

    {%block content%}
    <main class="content">
        <h1>Welcome to StockLens</h1>
        <p>Create an account, sign in, or sign out using the navbar above.</p>
    </main>
    {%endblock%}

</body>
</html>
